buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            Integer pluginCompileSdk = project.android.compileSdk

            if (project.name == 'contacts_service') {
                project.android {
                    namespace "flutter.plugins.contactsservice.contactsservice"
                    compileSdkVersion = 33 // Override to match your app

                }
            }  else if(project.name == 'flutter_native_splash') {
                project.android {
                    namespace "net.jonhanson.flutter_native_splash"
                    compileSdkVersion = 33 // Override to match your app
                }
            }  else if(project.name == 'image_gallery_saver') {
                project.android {
                    namespace "com.example.imagegallerysaver"
                    compileSdkVersion = 33 // Override to match your app
                }
            }  else if (project.name == 'gallery_saver') {
                if (project.plugins.hasPlugin('com.android.library')) {
                    project.android {
                        namespace "carnegietechnologies.gallery_saver"
                        compileSdkVersion = 33

                    }

                }
            } else if (project.name == 'qr_code_scanner') {
                if (project.plugins.hasPlugin('com.android.library')) {
                    project.android {
                        namespace "net.touchcapture.qr.flutterqr"
                        compileSdkVersion = 33

                    }
                }
            } else if (pluginCompileSdk != null && pluginCompileSdk < 33) {
                project.logger.error(
                        "Warning: Overriding compileSdk version in Flutter plugin: "
                                + project.name
                                + " from "
                                + pluginCompileSdk
                                + " to 33."
                )
                project.android {
                    compileSdk 33
                }
            }

            project.android {
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_1_8
                    targetCompatibility = JavaVersion.VERSION_1_8
                }

                if (project.plugins.hasPlugin('kotlin-android')) {
                    kotlinOptions {
                        jvmTarget = "1.8"
                    }
                }
            }
        }
    }

    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
